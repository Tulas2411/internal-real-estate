name: estate-internal
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: local_estate_only
      POSTGRES_DB: estate
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estate -d estate"]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.40
    command: mini -dir=/data -s3.port=9000
    environment:
      AWS_ACCESS_KEY_ID: local_estate
      AWS_SECRET_ACCESS_KEY: local_storage_only
      S3_BUCKET: estate-private,estate-test
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["storage-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  storage-data:
